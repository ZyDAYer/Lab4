name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================
  # Шаг тестирования: checkout, setup .NET, restore/build/test.
  # Выполняется и на push в main, и на pull request в main.
  # ==========================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore IsLabApp.sln

      - name: Build
        run: dotnet build IsLabApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test IsLabApp.sln --no-build --configuration Release --verbosity normal

  # ==========================================================
  # Сборка и публикация Docker-образа в GHCR.
  # Выполняется только при push в main (не на pull request):
  # у PR, особенно из форков, обычно нет прав/секретов на запись
  # в реестр пакетов, а публиковать образ из непроверенного кода
  # нежелательно. Для PR достаточно пройденного шага тестов выше.
  # ==========================================================
  docker:
    name: Build & Push Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
